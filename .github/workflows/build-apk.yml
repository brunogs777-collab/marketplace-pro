
name: Gerar APK Marketplace PRO

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Criar projeto Flutter
        run: flutter create --org com.marketplacepro --project-name marketplace_pro app

      - name: Instalar dependencias
        working-directory: app
        run: flutter pub add sqflite path

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Marketplace-PRO-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Copiar aplicativo Marketplace PRO
        run: cp lib/main.dart app/lib/main.dart
